<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六上語文：星際詞義探索 - AU</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e0f7fa;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #80deea;
            text-shadow: 0 0 10px rgba(128, 222, 234, 0.5);
            margin-bottom: 5px;
        }

        header p {
            font-size: 1rem;
            color: #b2ebf2;
            letter-spacing: 1px;
        }

        .game-container {
            background: rgba(16, 32, 52, 0.75);
            border: 2px solid #26c6da;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 0 25px rgba(38, 198, 218, 0.3);
            backdrop-filter: blur(8px);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #80deea;
            border-bottom: 1px solid rgba(38, 198, 218, 0.3);
            padding-bottom: 10px;
        }

        .question-card {
            background: linear-gradient(135deg, rgba(38, 198, 218, 0.15), rgba(128, 222, 234, 0.05));
            border: 1px solid #4dd0e1;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.25rem;
            line-height: 1.7;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(38, 198, 218, 0.2);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-planet {
            background: rgba(9, 26, 43, 0.8);
            color: #e0f7fa;
            border: 1.5px solid #26c6da;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-planet:hover {
            background: #26c6da;
            color: #090a0f;
            box-shadow: 0 0 15px #26c6da;
            transform: translateY(-3px);
        }

        .btn-planet.correct {
            background-color: #00e676 !important;
            border-color: #00e676 !important;
            color: #000 !important;
            box-shadow: 0 0 20px #00e676 !important;
        }

        .btn-planet.wrong {
            background-color: #ff5252 !important;
            border-color: #ff5252 !important;
            color: #fff !important;
            box-shadow: 0 0 20px #ff5252 !important;
        }

        .end-screen {
            text-align: center;
            display: none;
            padding: 20px 0;
        }

        .end-screen h2 {
            font-size: 2.2rem;
            color: #80deea;
            margin-bottom: 15px;
        }

        .end-screen p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #b2ebf2;
        }

        .btn-restart {
            background: linear-gradient(45deg, #00e676, #1de9b6);
            color: #090a0f;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
            transition: all 0.2s;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.7);
        }

        footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #80deea;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 六上語文：星際詞義探索</h1>
        <p>擁有者：AU</p>
    </header>

    <div class="game-container">
        <!-- 遊戲主畫面 -->
        <div id="game-screen">
            <div class="stats-bar">
                <div>關卡：<span id="current-level">1</span> / <span id="total-levels">12</span></div>
                <div>得分：<span id="score">0</span></div>
                <div>能源：<span id="lives">⚡⚡⚡</span></div>
            </div>

            <div class="question-card" id="definition-text">
                傳送門載入中...
            </div>

            <div class="options-grid" id="options-container">
                <!-- 動態生成選項 -->
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="end-screen" class="end-screen">
            <h2 id="end-title">🌌 航行完成！</h2>
            <p id="end-msg">你順利穿越了所有詞義星雲！</p>
            <button class="btn-restart" onclick="restartGame()">再次發射飛船</button>
        </div>
    </div>

    <footer>
        &copy; 2026 AU - 語文星際互動學習網
    </footer>

    <script>
        // 詞語與解釋資料庫
        const vocabData = [
            { word: "咆哮", def: "形容水流奔騰發出的巨大聲響，或形容人怒吼" },
            { word: "波濤洶湧", def: "波浪很大，水勢奔騰猛烈" },
            { word: "岌岌可危", def: "形容十分危險，快要崩塌或滅亡" },
            { word: "浩瀚", def: "形容廣廣大無邊，多用於形容海洋、星空或知識" },
            { word: "奔逃", def: "快速地逃跑" },
            { word: "干擾", def: "打擾、妨礙，使事情無法正常進行" },
            { word: "困頓", def: "形容處境艱難、疲憊窘迫" },
            { word: "開闊", def: "地方寬廣無遮擋，或形容心胸廣闊" },
            { word: "川流不息", def: "行人、車輛像水流一樣往來不斷" },
            { word: "停擺", def: "指事物暫停運轉或工作停止" },
            { word: "庇護", def: "給予遮蔽和保護" },
            { word: "晴空萬里", def: "形容天氣極好，天空沒有一片雲彩" }
        ];

        let currentIndex = 0;
        let lives = 3;
        let score = 0;
        let shuffledQuestions = [];

        function initGame() {
            currentIndex = 0;
            lives = 3;
            score = 0;
            shuffledQuestions = [...vocabData].sort(() => Math.random() - 0.5);
            document.getElementById('total-levels').textContent = vocabData.length;
            document.getElementById('score').textContent = score;
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('end-screen').style.display = 'none';
            updateLivesDisplay();
            loadQuestion();
        }

        function updateLivesDisplay() {
            document.getElementById('lives').textContent = "⚡".repeat(lives);
        }

        function loadQuestion() {
            if (currentIndex >= shuffledQuestions.length) {
                showEndScreen(true);
                return;
            }

            document.getElementById('current-level').textContent = currentIndex + 1;
            const currentItem = shuffledQuestions[currentIndex];
            
            document.getElementById('definition-text').textContent = currentItem.def;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            let options = [currentItem.word];
            let otherWords = vocabData.map(item => item.word).filter(w => w !== currentItem.word);
            otherWords.sort(() => Math.random() - 0.5);
            
            options.push(...otherWords.slice(0, 3));
            options.sort(() => Math.random() - 0.5);

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn-planet';
                btn.textContent = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentItem.word);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedWord, correctWord) {
            const buttons = document.querySelectorAll('.btn-planet');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedWord === correctWord) {
                selectedBtn.classList.add('correct');
                score += 100;
                document.getElementById('score').textContent = score;
                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 1000);
            } else {
                selectedBtn.classList.add('wrong');
                buttons.forEach(btn => {
                    if (btn.textContent === correctWord) {
                        btn.classList.add('correct');
                    }
                });

                lives--;
                updateLivesDisplay();

                if (lives <= 0) {
                    setTimeout(() => showEndScreen(false), 1200);
                } else {
                    setTimeout(() => {
                        currentIndex++;
                        loadQuestion();
                    }, 1500);
                }
            }
        }

        function showEndScreen(isWin) {
            document.getElementById('game-screen').style.display = 'none';
            const endScreen = document.getElementById('end-screen');
            endScreen.style.display = 'block';

            if (isWin) {
                document.getElementById('end-title').textContent = "🌌 探索完成！";
                document.getElementById('end-msg').textContent = `太棒了！你最終獲得了 ${score} 分，成功擊退所有未知星雲！`;
            } else {
                document.getElementById('end-title').textContent = "⚠️ 飛船能源耗盡！";
                document.getElementById('end-msg').textContent = `獲得分數：${score} 分。調整好狀態，再次出發吧！`;
            }
        }

        function restartGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
